<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .base-progress {
            height: 26px;
            width: 400px;
            border-radius: 15px;
            background-color: #272425;
            border: 3px solid #272425;
            box-sizing: border-box;
            margin-bottom: 30px;
        }

        .inner {
            position: relative;
            background: #379bff;
            border-radius: 15px;
            height: 25px;
            box-sizing: border-box;
            left: -3px;
            top: -2px;
            width: 30%
        }

        .inner span {
            position: absolute;
            right: 0;
            top: 26px;
        }
    </style>
</head>

<body>
    <div class="base-progress">
        <div class="inner" >
        </div>
    </div>
</body>

</html>
